# ========================================================
# CURITIPÃO — BLOCO NGINX SUBDOMÍNIO ANTIGO (MAPEAMENTO EXPLÍCITO)
# Domínio: curitipao.conexus.press
# Destino Oficial: https://curitipao.com.br
# ========================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name curitipao.conexus.press;

    # O certificado SSL deve permanecer ativo e válido
    # ssl_certificate /caminho/para/fullchain.pem;
    # ssl_certificate_key /caminho/para/privkey.pem;

    # 1. Raiz antiga e /index.html -> Festival 2026
    location = / {
        return 301 https://curitipao.com.br/festival/2026/$is_args$args;
    }

    location = /index.html {
        return 301 https://curitipao.com.br/festival/2026/$is_args$args;
    }

    # 2. Política de Privacidade
    location = /politica-de-privacidade.html {
        return 301 https://curitipao.com.br/privacidade/$is_args$args;
    }

    # 3. Sitemap e Robots
    location = /sitemap.xml {
        return 301 https://curitipao.com.br/sitemap.xml;
    }

    location = /robots.txt {
        return 301 https://curitipao.com.br/robots.txt;
    }

    # 4. Estilos e Scripts
    location = /style.css {
        return 301 https://curitipao.com.br/festival/2026/style.css;
    }

    location = /main.js {
        return 301 https://curitipao.com.br/festival/2026/main.js;
    }

    # 5. Favicons
    location ~ ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png)$ {
        return 301 https://curitipao.com.br$request_uri;
    }

    # 6. Assets históricos
    location /assets/ {
        return 301 https://curitipao.com.br$request_uri;
    }

    # 7. Rotas desconhecidas: 404 (sem redirecionar indiscriminadamente)
    location / {
        return 404;
    }
}
